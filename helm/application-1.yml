apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-from-scratch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MahmoudA-gawad/argocd-tutorial.git
    targetRevision: main
    path: helm/nginx
    helm:
      releaseName: application-from-helm
      valueFiles: 
        - custom-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
